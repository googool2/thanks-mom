<svg xmlns="http://www.w3.org/2000/svg" width="760" height="96" viewBox="0 0 760 96" role="img" aria-label="Thanks Mom in numbers" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title>Thanks Mom in numbers</title>
<rect x="0.5" y="0.5" width="180.0" height="95" rx="10" fill="none" stroke="rgba(255,255,255,0.12)"/>
<text x="16.0" y="42.0" font-size="28" fill="#f0efec" text-anchor="start" font-weight="600">−96%</text>
<text x="16.0" y="66.0" font-size="12" fill="#f0efec" text-anchor="start" font-weight="400">smaller, at best</text>
<text x="16.0" y="82.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">mobile apps</text>
<rect x="193.5" y="0.5" width="180.0" height="95" rx="10" fill="none" stroke="rgba(255,255,255,0.12)"/>
<text x="209.0" y="42.0" font-size="28" fill="#f0efec" text-anchor="start" font-weight="600">−31%</text>
<text x="209.0" y="66.0" font-size="12" fill="#f0efec" text-anchor="start" font-weight="400">tokens for an agent to find code</text>
<text x="209.0" y="82.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">after cleanup, measured</text>
<rect x="386.5" y="0.5" width="180.0" height="95" rx="10" fill="none" stroke="rgba(255,255,255,0.12)"/>
<text x="402.0" y="42.0" font-size="28" fill="#f0efec" text-anchor="start" font-weight="600">0</text>
<text x="402.0" y="66.0" font-size="12" fill="#f0efec" text-anchor="start" font-weight="400">files lost</text>
<text x="402.0" y="82.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">725,245 checked</text>
<rect x="579.5" y="0.5" width="180.0" height="95" rx="10" fill="none" stroke="rgba(255,255,255,0.12)"/>
<text x="595.0" y="42.0" font-size="28" fill="#f0efec" text-anchor="start" font-weight="600">11.5% → 0%</text>
<text x="595.0" y="66.0" font-size="12" fill="#f0efec" text-anchor="start" font-weight="400">wrong automatic decisions</text>
<text x="595.0" y="82.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">v1.0 → v1.1, reviewed by hand</text>
</svg>
