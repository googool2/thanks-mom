<svg xmlns="http://www.w3.org/2000/svg" width="760" height="96" viewBox="0 0 760 96" role="img" aria-label="Thanks Mom in numbers" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title>Thanks Mom in numbers</title>
<rect x="0.5" y="0.5" width="180.0" height="95" rx="10" fill="none" stroke="rgba(11,11,11,0.10)"/>
<text x="16.0" y="42.0" font-size="28" fill="#0b0b0b" text-anchor="start" font-weight="600">16</text>
<text x="16.0" y="66.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="400">real projects tested</text>
<text x="16.0" y="82.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">on copies, then deleted</text>
<rect x="193.5" y="0.5" width="180.0" height="95" rx="10" fill="none" stroke="rgba(11,11,11,0.10)"/>
<text x="209.0" y="42.0" font-size="28" fill="#0b0b0b" text-anchor="start" font-weight="600">0</text>
<text x="209.0" y="66.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="400">files lost</text>
<text x="209.0" y="82.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">725,245 checked</text>
<rect x="386.5" y="0.5" width="180.0" height="95" rx="10" fill="none" stroke="rgba(11,11,11,0.10)"/>
<text x="402.0" y="42.0" font-size="28" fill="#0b0b0b" text-anchor="start" font-weight="600">972 → 0</text>
<text x="402.0" y="66.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="400">wrong automatic decisions</text>
<text x="402.0" y="82.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">version 1.0 → 1.1</text>
<rect x="579.5" y="0.5" width="180.0" height="95" rx="10" fill="none" stroke="rgba(11,11,11,0.10)"/>
<text x="595.0" y="42.0" font-size="28" fill="#0b0b0b" text-anchor="start" font-weight="600">4.7 GB</text>
<text x="595.0" y="66.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="400">freed automatically</text>
<text x="595.0" y="82.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">before any question</text>
</svg>
