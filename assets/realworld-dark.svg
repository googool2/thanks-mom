<svg xmlns="http://www.w3.org/2000/svg" width="760" height="583" viewBox="0 0 760 583" role="img" aria-label="What mom did on 16 real projects" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title>What mom did on 16 real projects</title>
<text x="0.0" y="20.0" font-size="16" fill="#f0efec" text-anchor="start" font-weight="600">What mom did on 16 real projects</text>
<text x="0.0" y="40.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">Copies of real projects, cleaned with no questions answered. 20.7 GB → 16.0 GB, 362,623 → 101,866 files.</text>
<text x="0.0" y="77.0" font-size="13" fill="#f0efec" text-anchor="start" font-weight="600">Done automatically: space freed</text>
<g transform="translate(0,87.0)">
<text x="0.0" y="19.0" font-size="12" fill="#f0efec" text-anchor="start" font-weight="400">Dependencies (node_modules, vendor/)</text>
<path d="M250.0,7.0 h426.0 q4.0,0 4.0,4.0 v8.0 q0,4.0 -4.0,4.0 h-426.0 z" fill="#3987e5"/>
<text x="688.0" y="19.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">2.4 GB</text>
<text x="0.0" y="49.0" font-size="12" fill="#f0efec" text-anchor="start" font-weight="400">Caches (.next, __pycache__, .gradle)</text>
<path d="M250.0,37.0 h253.3 q4.0,0 4.0,4.0 v8.0 q0,4.0 -4.0,4.0 h-253.3 z" fill="#3987e5"/>
<text x="515.3" y="49.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">1.4 GB</text>
<text x="0.0" y="79.0" font-size="12" fill="#f0efec" text-anchor="start" font-weight="400">Build output (dist/, build/)</text>
<path d="M250.0,67.0 h161.2 q4.0,0 4.0,4.0 v8.0 q0,4.0 -4.0,4.0 h-161.2 z" fill="#3987e5"/>
<text x="423.2" y="79.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">939.5 MB</text>
<text x="0.0" y="109.0" font-size="12" fill="#f0efec" text-anchor="start" font-weight="400">Logs, temp and old files (boxed up)</text>
<path d="M250.0,97.0 h1.0 q1.0,0 1.0,1.0 v14.0 q0,1.0 -1.0,1.0 h-1.0 z" fill="#3987e5"/>
<text x="260.0" y="109.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">1.3 MB</text>
<line x1="250" y1="0" x2="250" y2="120" stroke="#2c2c2a" stroke-width="1"/>
</g>
<text x="0.0" y="217.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">Plus 31 loose docs moved into docs/. Every automatic decision was checked by hand.</text>
<text x="0.0" y="253.0" font-size="13" fill="#f0efec" text-anchor="start" font-weight="600">Left for you to decide: 347 questions, grouped by kind</text>
<g transform="translate(0,263.0)">
<text x="0.0" y="17.0" font-size="12" fill="#f0efec" text-anchor="start" font-weight="400">Headless browser profiles</text>
<path d="M250.0,6.0 h426.0 q4.0,0 4.0,4.0 v6.0 q0,4.0 -4.0,4.0 h-426.0 z" fill="#d95926"/>
<text x="688.0" y="17.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">95</text>
<text x="0.0" y="43.0" font-size="12" fill="#f0efec" text-anchor="start" font-weight="400">Duplicates of 1 MB or more</text>
<path d="M250.0,32.0 h299.3 q4.0,0 4.0,4.0 v6.0 q0,4.0 -4.0,4.0 h-299.3 z" fill="#d95926"/>
<text x="561.3" y="43.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">67</text>
<text x="0.0" y="69.0" font-size="12" fill="#f0efec" text-anchor="start" font-weight="400">Files inside data folders</text>
<path d="M250.0,58.0 h281.2 q4.0,0 4.0,4.0 v6.0 q0,4.0 -4.0,4.0 h-281.2 z" fill="#d95926"/>
<text x="543.2" y="69.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">63</text>
<text x="0.0" y="95.0" font-size="12" fill="#f0efec" text-anchor="start" font-weight="400">Big files</text>
<path d="M250.0,84.0 h145.4 q4.0,0 4.0,4.0 v6.0 q0,4.0 -4.0,4.0 h-145.4 z" fill="#d95926"/>
<text x="407.4" y="95.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">33</text>
<text x="0.0" y="121.0" font-size="12" fill="#f0efec" text-anchor="start" font-weight="400">Many loose docs at once</text>
<path d="M250.0,110.0 h118.2 q4.0,0 4.0,4.0 v6.0 q0,4.0 -4.0,4.0 h-118.2 z" fill="#d95926"/>
<text x="380.2" y="121.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">27</text>
<text x="0.0" y="147.0" font-size="12" fill="#f0efec" text-anchor="start" font-weight="400">Leftover-looking folders</text>
<path d="M250.0,136.0 h72.9 q4.0,0 4.0,4.0 v6.0 q0,4.0 -4.0,4.0 h-72.9 z" fill="#d95926"/>
<text x="334.9" y="147.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">17</text>
<text x="0.0" y="173.0" font-size="12" fill="#f0efec" text-anchor="start" font-weight="400">Old or backup names that something uses</text>
<path d="M250.0,162.0 h59.4 q4.0,0 4.0,4.0 v6.0 q0,4.0 -4.0,4.0 h-59.4 z" fill="#d95926"/>
<text x="321.4" y="173.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">14</text>
<text x="0.0" y="199.0" font-size="12" fill="#f0efec" text-anchor="start" font-weight="400">Loose images at the root</text>
<path d="M250.0,188.0 h50.3 q4.0,0 4.0,4.0 v6.0 q0,4.0 -4.0,4.0 h-50.3 z" fill="#d95926"/>
<text x="312.3" y="199.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">12</text>
<text x="0.0" y="225.0" font-size="12" fill="#f0efec" text-anchor="start" font-weight="400">Names like a copy</text>
<path d="M250.0,214.0 h45.8 q4.0,0 4.0,4.0 v6.0 q0,4.0 -4.0,4.0 h-45.8 z" fill="#d95926"/>
<text x="307.8" y="225.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">11</text>
<text x="0.0" y="251.0" font-size="12" fill="#f0efec" text-anchor="start" font-weight="400">Scripts that look one-off</text>
<path d="M250.0,240.0 h18.6 q4.0,0 4.0,4.0 v6.0 q0,4.0 -4.0,4.0 h-18.6 z" fill="#d95926"/>
<text x="280.6" y="251.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">5</text>
<text x="0.0" y="277.0" font-size="12" fill="#f0efec" text-anchor="start" font-weight="400">node_modules without a lockfile</text>
<path d="M250.0,266.0 h5.1 q4.0,0 4.0,4.0 v6.0 q0,4.0 -4.0,4.0 h-5.1 z" fill="#d95926"/>
<text x="267.1" y="277.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">2</text>
<text x="0.0" y="303.0" font-size="12" fill="#f0efec" text-anchor="start" font-weight="400">Logs that something uses</text>
<path d="M250.0,292.0 h2.3 q2.3,0 2.3,2.3 v9.5 q0,2.3 -2.3,2.3 h-2.3 z" fill="#d95926"/>
<text x="262.5" y="303.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">1</text>
<line x1="250" y1="0" x2="250" y2="312" stroke="#2c2c2a" stroke-width="1"/>
</g>
</svg>
